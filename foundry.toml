[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
code_size_limit = 100000

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 20
depth = 200
